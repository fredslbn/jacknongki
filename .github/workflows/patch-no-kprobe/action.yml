name: 'Patch Kernel for no-kprobe.'

runs:
  using: 'composite'
  steps:
      - name: Patch Kernel for no-kprobe
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # Patching xxKSU for clang inline optimization
          if [[ "${{ env.KERNELSU_SOURCE }}" == *backslashxx* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]]; then
             
             if [[ "${{ env.KERNEL_TYPE }}" == "4.19" ]]; then
                cp /tmp/Patches/4.19_scope_minimized_manual_hooks_2.3.patch ./
                patch -p1 < 4.19_scope_minimized_manual_hooks_2.3.patch || true
                echo "[...] 4.19_scope_minimized_manual_hooks_2.3 patch applied." 
             elif [[ "${{ env.KERNEL_TYPE }}" == "4.14" ]]; then
                cp /tmp/Patches/4.14_scope_minimized_manual_hooks_2.3.patch ./
                patch -p1 < 4.14_scope_minimized_manual_hooks_2.3.patch || true
                echo "[...] 4.14_scope_minimized_manual_hooks_2.3 patch applied." 
             fi
             
             cp /tmp/Patches/clang_xxksu_inline.patch ./
             patch -p1 < clang_xxksu_inline.patch || true
             echo "[...] clang_xxksu_inline patch applied."
             
          else
          
            echo "[-] Your KernelSU is not xxKSU, patch clang_xxksu_inline being skipped."
          
          fi
          
          # Detect SuSFS is used to enable the SuSFS inline hook
          if [[ ${{ env.SUSFS_ENABLE }} == "true" ]] && { [[ "${{ env.KERNELSU_SOURCE }}" == *BakaSU* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "bakasu" ]]; }; then
            # Core
            cp /tmp/Patches/susfs_inline_hook_patches.sh ./
            bash susfs_inline_hook_patches.sh ./

            echo "[+] executed SuSFS inline hook successfully."

          # Check syscall hook
          elif [[ ${{ env.HOOK_METHOD }} == "syscall" ]]; then
            # Core
            cp /tmp/Patches/syscall_hook_patches.sh ./
            bash syscall_hook_patches.sh ./
            
            echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

            echo "[+] SYSCALL HOOK method applied."
                      
          elif [[ ${{ env.HOOK_METHOD }} == "tamper" ]]; then
             CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
             
             sed -i '/CONFIG_KALLSYMS_ALL/d' "$CONFIG_FILE"
             sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
             sed -i '/CONFIG_HAVE_KPROBES/d' "$CONFIG_FILE"
             sed -i '/CONFIG_KPROBE_EVENTS/d' "$CONFIG_FILE"

             echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_HOSTSREDIRECT=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$CONFIG_FILE"
             echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_COMPILE_AS_C23=y" >> "$CONFIG_FILE"             
             # echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y" >> "$CONFIG_FILE"
             echo "CONFIG_KPROBES=n" >> "$CONFIG_FILE"
             echo "CONFIG_HAVE_KPROBES=n" >> "$CONFIG_FILE"
             echo "CONFIG_KPROBE_EVENTS=n" >> "$CONFIG_FILE"

             echo "[+] TAMPER HOOK method applied."
 
                       
          elif [[ ${{ env.HOOK_METHOD }} == "branchlink" ]]; then
             if [[ ${{ env.DEVICE_CODENAME }} == "Surya" ]]; then
                CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
             
                sed -i '/CONFIG_KALLSYMS_ALL/d' "$CONFIG_FILE"
                sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
                sed -i '/CONFIG_HAVE_KPROBES/d' "$CONFIG_FILE"
                sed -i '/CONFIG_KPROBE_EVENTS/d' "$CONFIG_FILE"
             
                echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_HOSTSREDIRECT=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$CONFIG_FILE"
                echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_COMPILE_AS_C23=y" >> "$CONFIG_FILE"
                # echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_FEATURE_SULOG=y" >> "$CONFIG_FILE"
                echo "CONFIG_KPROBES=n" >> "$CONFIG_FILE"
                echo "CONFIG_HAVE_KPROBES=n" >> "$CONFIG_FILE"
                echo "CONFIG_KPROBE_EVENTS=n" >> "$CONFIG_FILE"
                                       
                echo "[+] BRANCHLINK HOOK POCO X3 method applied."
             
             else
             
                CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"             
                sed -i '/CONFIG_KALLSYMS_ALL/d' "$CONFIG_FILE"
                sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
             
                echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_HOSTSREDIRECT=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$CONFIG_FILE"
                echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_COMPILE_AS_C23=y" >> "$CONFIG_FILE"
                # echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$CONFIG_FILE"
                echo "CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y" >> "$CONFIG_FILE"             
                echo "CONFIG_KPROBES=n" >> "$CONFIG_FILE"
                                       
                echo "[+] BRANCHLINK HOOK method applied."
                
             fi                                             
          
          elif [[ ${{ env.HOOK_METHOD }} == "branchlink-gki" ]]; then
             CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
             
             echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_HOSTSREDIRECT=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$CONFIG_FILE"
             echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_COMPILE_AS_C23=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_KPROBES_KSUD=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$CONFIG_FILE"
             echo "CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y" >> "$CONFIG_FILE"

             echo "[+] BRANCHLINK GKI HOOK method applied."
  
          
          elif [[ ${{ env.HOOK_METHOD }} == "LKM" ]]; then

             echo "[+] LKM HOOK method applied from xxksu.config."
          
          
          else
          
            echo "[-] please input a vaild option!"
            false

          fi

          # Check for static state in partial functions
          KERNEL_VERSION=$(head -n 3 Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')
          SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')

          if ! grep -rq "check_symbol_export" "drivers/kernelsu/tools/static_export_check.mk" >/dev/null 2>&1; then
            echo "[-] Your KernelSU doesn't need static state in partial functions. Skipped."

          elif [[ "${{ env.KPM_ENABLE }}" == "true" ]]; then
            echo "[+] Detected KPM, Skipped."

          elif grep -q "CONFIG_KALLSYMS=y" "./arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}" && grep -q "CONFIG_KALLSYMS_ALL=y" "./arch/"${{ env.KERNEL_ARCH }}"/configs/${{ env.DEFCONFIG_NAME }}" >/dev/null 2>&1; then
            echo "[+] Detected KALLSYMS enabled, Skipped."

          else
            if grep "const write_op" "security/selinux/selinuxfs.c" >/dev/null 2>&1; then
                sed -i 's/static ssize_t (\*const write_op\[\])(struct file \*, char \*, size_t)/ssize_t (*const write_op[])(struct file *, char *, size_t)/' security/selinux/selinuxfs.c
            else
                sed -i 's/static ssize_t (\*write_op\[\])(struct file \*, char \*, size_t)/ssize_t (*write_op[])(struct file *, char *, size_t)/' security/selinux/selinuxfs.c
            fi
            
            sed -i 's/^static const struct file_operations sel_handle_status_ops = {/const struct file_operations sel_handle_status_ops = {/' security/selinux/selinuxfs.c
            sed -i 's/static void security_dump_masked_av(struct policydb \*policydb,/void security_dump_masked_av(struct policydb *policydb,/' security/selinux/ss/services.c
            sed -i 's/static void context_struct_compute_av(struct policydb \*policydb,/void context_struct_compute_av(struct policydb *policydb,/' security/selinux/ss/services.c
            
            echo "[+] Removed write_op, sel_handle_status_ops, security_dump_masked_av and context_struct_compute_av static state."

            if [ "$FIRST_VERSION" -lt 5 ] && [ "$SECOND_VERSION" -lt 15 ]; then
                if grep -q "sel_mutex" "security/selinux/selinuxfs.c" >/dev/null 2>&1; then
                    sed -i 's/^static DEFINE_MUTEX(sel_mutex)/DEFINE_MUTEX(sel_mutex)/' security/selinux/selinuxfs.c
                    echo "[+] Removed sel_mutex static state."

                else
                    echo "[-] Your Kernel haven't sel_mutex, Skipped."
                fi

                if grep -q "selinux_status_page" "security/selinux/ss/status.c" >/dev/null 2>&1; then
                    sed -i 's/^static struct page \*selinux_status_page/struct page *selinux_status_page/' security/selinux/ss/status.c
                    echo "[+] Removed selinux_status_page static state."

                else
                    echo "[-] Your Kernel haven't selinux_status_page, Skipped."
                fi

                if grep -q "selinux_status_lock" "security/selinux/ss/status.c" >/dev/null 2>&1; then
                    sed -i 's/^static DEFINE_MUTEX(selinux_status_lock)/DEFINE_MUTEX(selinux_status_lock)/' security/selinux/ss/status.c
                    echo "[+] Removed selinux_status_lock static state."

                else
                    echo "[-] Your Kernel haven't selinux_status_lock, Skipped."
                fi
            fi

            if [ "$FIRST_VERSION" -lt 4 ] && [ "$SECOND_VERSION" -lt 19 ]; then
                if grep -q "selinux_status_page" "security/selinux/hooks.c" >/dev/null 2>&1; then
                    sed -i 's/^static struct security_operations selinux_ops/struct security_operations selinux_ops/' security/selinux/hooks.c
                    echo "[+] Removed selinux_ops static state."

                else
                    echo "[-] Your Kernel haven't selinux_ops, Skipped."
                fi
            fi

            echo "[+] Checked successfully."
          fi
