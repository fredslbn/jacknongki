name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_call:

jobs:
 
  # Xiaomi
  

  build_renote5_android13:
    name: "Redmi Note 5/Pro (Based AOSP A13)"
    strategy:
      fail-fast: true
    uses: ./.github/workflows/build_renote5_android13.yml
    secrets: inherit
    
  build_pocox5_android13:
    name: "Poco X5 (Based AOSP A13)"
    strategy:
      fail-fast: true
    uses: ./.github/workflows/build_pocox5_android13.yml
    secrets: inherit
  
  build_pocom3_android13:
    name: "Poco M3"
    strategy:
      fail-fast: true
    uses: ./.github/workflows/build_pocom3_android13.yml
    secrets: inherit
  
  build_renote10pro_android13:
    name: "Renote 10 Pro (Based AOSP A13)"
    strategy:
      fail-fast: true
    uses: ./.github/workflows/build_renote10pro_android13.yml
    secrets: inherit

  build_pocox3_android13:
    name: "Poco X3 (Based AOSP A13)"
    strategy:
      fail-fast: true
    uses: ./.github/workflows/build_pocox3_android13.yml
    secrets: inherit  
