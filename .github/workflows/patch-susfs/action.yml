name: 'Patch SuSFS for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Get SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Core
          if [[ "${{ env.SUSFS_FIXED }}" == true ]]; then
            if [ -z "${{ env.PATCHES_SOURCE }}" ] || [ -z "${{ env.PATCHES_BRANCH }}" ]; then
              echo "[-] Please input a vaild source and branch!"
              false

            elif [[ "${{ env.PATCHES_SOURCE }}" == *".git" ]]; then
              echo "[-] Please do not set a full URL in PATCH_SOURCE!"
              false

            else
              git clone https://github.com/${{ env.PATCHES_SOURCE }}.git -b ${{ env.PATCHES_BRANCH }} NonGKI_Kernel_Patches --depth=1 # It's not necessary.

            fi

          fi

      - name: Set KSU and SUSFS for DEFCONFIG
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "CONFIG_KSU_SUSFS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          if grep -q "THREAD_INFO_IN_TASK" "drivers/kernelsu/Kconfig"; then
            echo "CONFIG_THREAD_INFO_IN_TASK=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          fi

      - name: Patch SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          SUSFS_VERSION="2.3.00"

          PACK_FILES(){
            temp_dir=$(mktemp -d)
            find . -name "*.rej" -exec cp --parents {} "$temp_dir" \;
            find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} test -f {} && find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} cp --parents {} "$temp_dir"
            tar -czf "rej_files_1.5.5.tar.gz" -C "$temp_dir" .
            rm -rf "$temp_dir"
            echo "[+] Packed Successfully."

            find . -type f \( -name "*.rej" -o -name "*.orig" \) -delete
            echo "[+] Removed all .rej and .orig files."
            echo "[+] =================================== "

          }

          
          ### FREDS MODIF
          # Check SuSFS
          if grep -q "CONFIG_KSU_SUSFS_SUS_MOUNT" "fs/namei.c"; then
              if [[ "${{ env.KERNEL_SOURCE }}" == *entahsiapa* ]]; then              
                  patch -p1 < <(curl -sL "https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/patches/55_try_umount_for_susfs.patch") || true
                  echo "[+] Kernel source already has SUSFS patch, only need try_umount patch, and has been applied now."               
              else                        
                 echo "[-] SuSFS is already patched, Skipped."
                 echo "SUSFS_SKIP=true" >> $GITHUB_ENV
              fi

          else

          #  if [[ "${{ env.KERNELSU_SOURCE }}" == *backslashxx* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]]; then
          #    wget https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/scripts/susfs_deinlined.sh
          #    chmod +x susfs_deinlined.sh
          #    ./susfs_deinlined.sh susfs_patch_to_${{ env.KERNEL_VERSION }}.patch deinlined.patch
          #    patch -p1 < deinlined.patch || true
          #    echo "[+] deinlined patch success."
          #    patch -p1 < <(curl -sL "https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/patches/55_try_umount_for_susfs.patch") || true
          #    echo "[+] try_umount susfs patch success."
          #  else
          
              if [[ "${{ env.CUSTOM_SUSFS_PATCH }}" == "true" ]]; then
              
                 if [[ "${{ env.DEVICE_CODENAME }}" == "Citrus" ]]; then
                 cp /tmp/Patches/Patch/susfs_pocom3_patch_to_4.19.patch ./
                 patch -p1 < susfs_pocom3_patch_to_4.19.patch || true                 
                 echo "[+] Custom PocoM3 SuSFS Patch completed."
                 
                 elif [[ "${{ env.DEVICE_CODENAME }}" == "Sweet" ]]; then
                 cp /tmp/Patches/Patch/susfs_renote10pro_patch_to_4.14.patch ./
                 patch -p1 < susfs_renote10pro_patch_to_4.14.patch || true                 
                 echo "[+] Custom Renote10Pro SuSFS Patch completed."
                 
                 
                 ## GKI 6.6
                 elif [[ "${{ env.GKI_KERNEL_BRANCH }}" == "6.6" ]]; then                 
                    # Clone SUSFS4KSU for kernel patches only (not KSU integration)
                    echo "📦 Cloning SUSFS4KSU for kernel patches..."
                    git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
                    
                    SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"                   
                    
                    echo "🔧 Applying SUSFS kernel patch..."
                    wget https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/scripts/susfs_deinlined.sh
                    chmod +x susfs_deinlined.sh
                    
                    cp /tmp/Patches/Patch/50_add_susfs_in_gki-android15-6.6.patch ./
                    # ./susfs_deinlined.sh "$SUSFS_KERNEL_PATCH" deinlined.patch
                    ./susfs_deinlined.sh 50_add_susfs_in_gki-android15-6.6.patch deinlined.patch
                       if patch -p1 < deinlined.patch || true; then
                          echo "✅ SUSFS patch successfully applied"
                       else
                          echo "⚠️ SUSFS patch failed — copying files manually"
                       fi
                    
                    # Always copy fs/susfs.c          
                    cp -f susfs4ksu/kernel_patches/fs/* fs/
                    echo "✔ Copied fs/susfs.c"                    
                    # Always copy include/linux/susfs.h and susfs_def.h         
                    cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/
                    echo "✔ Copied include/linux/*"
                    
                    echo "🔍 Verifying SUSFS files..."
                    for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
                       if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
                    done
                    
                    # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
                    rm -rf susfs4ksu
                    echo "✅ SUSFS build wiring verified"                    
                    # cp /tmp/Patches/Patch/susfs_pocof7_patch_to_6.6.patch ./
                    # patch -p1 < susfs_pocof7_patch_to_6.6.patch || true                 
                    echo "[+] GKI 6.6 is already in SuSFS Patch completed."
 
 
                 ## GKI 5.15
                 elif [[ "${{ env.GKI_KERNEL_BRANCH }}" == "5.15" ]]; then                 
                    # Clone SUSFS4KSU for kernel patches only (not KSU integration)
                    echo "📦 Cloning SUSFS4KSU for kernel patches..."
                    git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
                    
                    SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"                   
                    
                    echo "🔧 Applying SUSFS kernel patch..."
                    wget https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/scripts/susfs_deinlined.sh
                    chmod +x susfs_deinlined.sh
                    
                    # cp /tmp/Patches/Patch/50_add_susfs_in_gki-android13-5.15.patch ./
                    ./susfs_deinlined.sh "$SUSFS_KERNEL_PATCH" deinlined.patch
                    # ./susfs_deinlined.sh 50_add_susfs_in_gki-android13-5.15.patch deinlined.patch
                       if patch -p1 < deinlined.patch || true; then
                          echo "✅ SUSFS patch successfully applied"
                       else
                          echo "⚠️ SUSFS patch failed — copying files manually"
                       fi
                    
                    # Always copy fs/susfs.c          
                    cp -f susfs4ksu/kernel_patches/fs/* fs/
                    echo "✔ Copied fs/susfs.c"                    
                    # Always copy include/linux/susfs.h and susfs_def.h         
                    cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/
                    echo "✔ Copied include/linux/*"
                    
                    echo "🔍 Verifying SUSFS files..."
                    for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
                       if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
                    done
                    
                    # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
                    rm -rf susfs4ksu
                    echo "✅ SUSFS build wiring verified"                    
                    # cp /tmp/Patches/Patch/susfs_pocof7_patch_to_6.6.patch ./
                    # patch -p1 < susfs_pocof7_patch_to_6.6.patch || true                 
                    echo "[+] GKI 5.15 is already in SuSFS Patch completed."
                 
                 fi
              
              else            
                 cp /tmp/Patches/Patch/susfs_patch_to_${{ env.KERNEL_VERSION }}.patch ./
                 patch -p1 < susfs_patch_to_${{ env.KERNEL_VERSION }}.patch || true
                 # patch --ignore-whitespace -p1 < (1)superc.patch || true
                 echo "[+] SuSFS Patch completed."
              
              fi
                          
              if [[ "${{ env.KERNELSU_SOURCE }}" == *backslashxx* ]] || [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]]; then                  
                  if [[ "${{ env.GKI_TYPE_KERNEL }}" == "true" ]]; then
                     echo "[+] This is GKI 2.0 kernel, no need for patching try_umount susfs."
                  else                  
                     cp /tmp/Patches/try_umount_for_susfs.patch ./
                     patch -p1 < try_umount_for_susfs.patch || true              
                     # patch -p1 < <(curl -sL "https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/patches/55_try_umount_for_susfs.patch") || true
                     echo "[+] try_umount patch for xxKSU successfully applied."
                  fi

              else
              
                  echo "[+] This is not xxKSU, so no need for patching try_umount susfs."
              
              fi
            
          fi

          # Patch .rej find
          if [[ "${{ env.BUILD_DEBUGGER }}" == "true" ]]; then
            echo "[+] Checking SuSFS v${SUSFS_VERSION} rej files..."
            mapfile -t REJ_FILES < <(find . -type f -name "*.rej")

            if [ ${#REJ_FILES[@]} -eq 0 ]; then
                echo "[+] Your kernel have no any rej files, Skipped."

            else
                for CAT_REJ in "${REJ_FILES[@]}"; do
                    echo "[-] Found .rej file: $CAT_REJ"
                    cat $CAT_REJ
                    echo "[+] =================================== "
                done

            fi

            if [[ "${{ env.SKIP_PATCH }}" == "true" ]] || [ -n "${{ env.SUSFS_PATCH_FIXED }}" ]; then
                echo "[+] SuSFS Patch Version: v${SUSFS_VERSION}. "
                echo "[+] SKIP_PATCH enabled or found SuSFS v2.2.00 Fixed Patch, skipping."
                PACK_FILES

            elif [[ "${{ env.SKIP_PATCH }}" != "true" ]] || [ -z "${{ env.SUSFS_PATCH_FIXED }}" ]; then
                echo "[+] SuSFS Patch Version: v${SUSFS_VERSION}. "
                echo "[-] Found .rej files, Stopped! "
                PACK_FILES
                false

            fi

          fi

      - name: SUSFS Patch Fixed
        if: env.SUSFS_ENABLE == 'true' && env.SUSFS_SKIP != 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          if [[ -z "${{ env.SUSFS_PATCH_FIXED }}" ]]; then
            echo "[-] You didn't provide any patch file."

          else
            IFS=',' read -ra FIXED_LIST <<< "${{ env.SUSFS_PATCH_FIXED }}"
            echo "[+] =================================== "
            for i in "${!FIXED_LIST[@]}"; do
              echo "Patching -> ${FIXED_LIST[$i]}"

              if [[ -z "${{ env.SUSFS_FOLDER_FIXED }}" ]]; then
                cp NonGKI_Kernel_Patches/${FIXED_LIST[$i]}.patch ./

              else
                cp NonGKI_Kernel_Patches/"${{ env.SUSFS_FOLDER_FIXED }}"/${FIXED_LIST[$i]}.patch ./

              fi

              patch -p1 < ${FIXED_LIST[$i]}.patch || true
              echo "[+] Patching successful!"
              echo "[+] =================================== "
            done

          fi

      - name: Upload Build Patch Rejected Files
        if: env.BUILD_DEBUGGER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch_rejected_files
          path: |
            device_kernel/rej_files_*
