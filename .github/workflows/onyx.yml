name: "Build v2 Poco F7"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "6.6"
  ANDROID_VERSION: "15"
  DEVICE_CODENAME: "Onyx"
  KSU_TYPE: "xxKSU"

on:
  workflow_dispatch:
        
jobs:
  build-kernels:
    name: "🐎 Build Super.Kernel ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android15-6.6-lts"
            defconfig: "gki_defconfig"
            local_version: "-super.kernel-gki"
            output_name: "Image.gki.ksu"
            enable_xxksu: true
            enable_ffksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/fredslbn/Patches/refs/heads/main/GKI/6.6/gki_fixup.patch"
              - "https://raw.githubusercontent.com/fredslbn/Patches/refs/heads/main/GKI/6.6/gki_hostbuild.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/qcom.git"
            branch: "kernel.lnx.6.6.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-super.kernel-clo"
            output_name: "Image.clo.ksu"
            enable_xxksu: true
            enable_ffksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/fredslbn/Patches/refs/heads/main/GKI/6.6/gki_fixup.patch"
              - "https://raw.githubusercontent.com/fredslbn/Patches/refs/heads/main/GKI/6.6/gki_hostbuild.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 10GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 10
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config common           
          sed -i '/^CLANG_VERSION=.*/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants          
          sed -i '$a\CLANG_VERSION=r547379' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=y" >> "$CONFIG_FILE"

          # Helper
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          # Apply patches
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

      - name: "🔧 Add Nomount"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding Nomount...";
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "[+] Patched NoMount for your kernel successfully."
      
      - name: "🔧 Setup xxKSU"        
        if: matrix.kernel.enable_xxksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KSU..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
          echo "✔ KSU installed successfully"       

          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_HOSTSREDIRECT=y
          CONFIG_KSU_KPROBES_KSUD=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_COMPILE_AS_C23=y
          CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y
          EOF
                    
          echo "✅ xxKSU configs added"
          
          echo "🔧 Applying SUSFS xxKSU patch..."
          ## SUSFS PATCHES FOR KERNELSU SUSFS          
          patch -p1 -d KernelSU < <(curl -sSfL "https://github.com/midori01/KernelSU/commit/xx~1.patch") || true
          patch -p1 -d KernelSU < <(curl -sSfL "https://github.com/midori01/KernelSU/commit/xx.patch") || true
          echo "✅ SUSFS xxKSU patch successfully applied"

          # Clone SUSFS4KSU for kernel patches only (not KSU integration)
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6       
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          
          echo "🔧 Applying SUSFS kernel patch..."
          wget https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/scripts/susfs_deinlined.sh
          chmod +x susfs_deinlined.sh
          ./susfs_deinlined.sh "$SUSFS_KERNEL_PATCH" deinlined.patch
             if patch -p1 < deinlined.patch || true; then
                echo "✅ SUSFS patch successfully applied"
             else
                echo "⚠️ SUSFS patch failed — copying files manually"
             fi
                    
          # Always copy fs/susfs.c          
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          echo "✔ Copied fs/susfs.c"
          
          # Always copy include/linux/susfs.h and susfs_def.h         
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/
          echo "✔ Copied include/linux/*"
          
          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done
          
          # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
          rm -rf susfs4ksu          

          echo "✅ SUSFS build wiring verified"

          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF                    

      - name: "🔧 Setup ffKSU"        
        if: matrix.kernel.enable_ffksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KSU..."
          curl -LSs "https://raw.githubusercontent.com/fredslbn/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
          echo "✔ KSU installed successfully"       

          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_HOSTSREDIRECT=y
          CONFIG_KSU_KPROBES_KSUD=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_COMPILE_AS_C23=y
          CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y
          EOF
                    
          echo "✅ ffKSU configs added"
          
          echo "🔧 Applying SUSFS ffKSU patch..."
          ## SUSFS PATCHES FOR KERNELSU SUSFS          
          patch -p1 -d KernelSU < <(curl -sSfL "https://github.com/midori01/KernelSU/commit/xx~1.patch") || true
          patch -p1 -d KernelSU < <(curl -sSfL "https://github.com/midori01/KernelSU/commit/xx.patch") || true
          echo "✅ SUSFS ffKSU patch successfully applied"

          # Clone SUSFS4KSU for kernel patches only (not KSU integration)
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6        
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          
          echo "🔧 Applying SUSFS kernel patch..."
          wget https://raw.githubusercontent.com/midori01/gki_ksu_workflow/refs/heads/main/.github/scripts/susfs_deinlined.sh
          chmod +x susfs_deinlined.sh
          ./susfs_deinlined.sh "$SUSFS_KERNEL_PATCH" deinlined.patch
             if patch -p1 < deinlined.patch || true; then
                echo "✅ SUSFS patch successfully applied"
             else
                echo "⚠️ SUSFS patch failed — copying files manually"
             fi
                    
          # Always copy fs/susfs.c          
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          echo "✔ Copied fs/susfs.c"
          
          # Always copy include/linux/susfs.h and susfs_def.h         
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/
          echo "✔ Copied include/linux/*"
          
          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done
          
          # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
          rm -rf susfs4ksu          

          echo "✅ SUSFS build wiring verified"

          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: "🧩 Apply BBRv3 Patch"
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         set -euo pipefail
                           
         patch -p1 < <(curl -sSfL "https://raw.githubusercontent.com/fatalcoder524/kernel_patches_additional/refs/heads/main/bbr3/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch") || true
         echo "✅ BBRv3 patch successfully applied"
         
      
      - name: "⚙️ Setup basic configs"
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # addon configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_BBR3=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_HZ="300"
          CONFIG_HZ_300=y
          EOF
          
          echo "✅ Basic configs added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         # echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         # echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo "Custom Makefile line added successfully"
    
      - name: "⚙️ Clean Dirty Flags and ABI Exports"
        shell: bash
        working-directory: ${{ env.WORK_DIR }}
        run: |        
         # Clean dirty flags and ABI exports based on build system
         if [ -f "build/build.sh" ]; then
          # Old build system (5.10, 5.15, early 6.1)
          sed -i 's/-dirty//' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/scripts/setlocalversion
         else
          # Bazel build system (newer kernels)
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/-dirty//' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/scripts/setlocalversion
         fi

      
      - name: "🔨 Build kernel"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |           
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' ${{ env.KERNEL_NAME }}/BUILD.bazel

          tools/bazel build \
          --config=fast \
          //${{ env.KERNEL_NAME }}:kernel_aarch64/Image

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |          
          cp ${{ env.WORK_DIR }}/bazel-bin/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/kernel_aarch64/Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y%m%d-%H%M%S')
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3
          sed -i 's/by belowzeroiq @ github/Superkernel by freds @ wtc2/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          # Copy kernels
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          # Create ZIP
          ZIP_NAME="${{ env.DEVICE_CODENAME }}-v2-${{ env.KSU_TYPE }}-${BUILD_TIME}-AnyKernel3.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v7
        with:          
          path: ${{ env.ZIP_PATH }}
          archive: false
          retention-days: 1
